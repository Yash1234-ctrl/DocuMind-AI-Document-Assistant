services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 8000
      CLIENT_ORIGIN: http://localhost:8080
      TRUST_PROXY_HOPS: 1
    expose:
      - "8000"
    volumes:
      - rag_uploads:/app/uploads
      - model_cache:/home/node/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:8000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped

volumes:
  rag_uploads:
  model_cache:
